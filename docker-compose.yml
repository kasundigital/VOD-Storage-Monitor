services:
  vod-monitor:
    image: ghcr.io/kasundigital/vod-storage-monitor:latest
    container_name: vod-monitor
    env_file:
      - .env
    environment:
      - TZ=${TZ:-America/New_York}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - REFRESH_SECONDS=${REFRESH_SECONDS:-60}
      - SYNC_STALE_HOURS=${SYNC_STALE_HOURS:-26}
      - SCRUB_STALE_DAYS=${SCRUB_STALE_DAYS:-14}
      - SNAPRAID_CONFIG=${SNAPRAID_CONFIG:-/etc/snapraid.conf}
      - SNAPRAID_LOG_PATH=${SNAPRAID_LOG_PATH:-/docker/snapraid-recovery-backup/resync-final.log}
      - SNAPRAID_SCRUB_LOG_PATH=${SNAPRAID_SCRUB_LOG_PATH:-}
      - SNAPRAID_SNAPSHOT_PATH=${SNAPRAID_SNAPSHOT_PATH:-/docker/vod-monitor/data/snapraid-snapshot.json}
      - ENABLE_DOCKER_MONITOR=${ENABLE_DOCKER_MONITOR:-false}
    ports:
      - "8099:8099"
    volumes:
      - ./data:/data
      - /etc/snapraid.conf:/etc/snapraid.conf:ro
      - /var/lib/snapraid:/var/lib/snapraid:ro
      - /etc/hostname:/host/etc/hostname:ro
      - /run/udev:/run/udev:ro
      - /proc:/host/proc:ro
      - /mnt:/mnt:ro
      - /docker:/docker:ro
      - /dev:/dev:ro
    privileged: true
    restart: unless-stopped
