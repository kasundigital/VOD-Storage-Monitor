services:
  vod-monitor:
    image: ghcr.io/kasundigital/vod-storage-monitor:latest
    container_name: vod-monitor
    env_file:
      - .env
    environment:
      - TZ=${TZ:-America/New_York}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - REFRESH_SECONDS=${REFRESH_SECONDS:-60}
      - SNAPRAID_CONFIG=${SNAPRAID_CONFIG:-/etc/snapraid.conf}
      - ENABLE_ACTIONS=${ENABLE_ACTIONS:-false}
      - ENABLE_DOCKER_MONITOR=${ENABLE_DOCKER_MONITOR:-false}
    ports:
      - "8099:8099"
    volumes:
      - ./data:/data
      - /etc/snapraid.conf:/etc/snapraid.conf:ro
      - /var/lib/snapraid:/var/lib/snapraid:ro
      - /etc/hostname:/host/etc/hostname:ro
      - /run/udev:/run/udev:ro
      - /proc:/host/proc:ro
      - /mnt:/mnt:ro
      - /docker:/docker:ro
      - /dev:/dev:ro
    cap_add:
      - SYS_RAWIO
    device_cgroup_rules:
      - 'b 8:* rwm'
      - 'b 9:* rwm'
      - 'b 21:* rwm'
      - 'b 259:* rwm'
    restart: unless-stopped
